name: Generate Docker Physical RootFS
on:
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Load and Extract Docker Overlay2 Data
        run: |
          # 1. 停止系统自带的 docker 避免冲突
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /var/lib/docker
          sudo systemctl start docker
          
          # 2. 下载你需要的所有 K8s 核心镜像（此处包含你之前需要的组件）
          IMAGES=(
            "gcr.io/k8s-minikube/kicbase:v0.0.50"
            "registry.k8s.io/kube-apiserver:v1.35.1"
            "registry.k8s.io/kube-controller-manager:v1.35.1"
            "registry.k8s.io/kube-scheduler:v1.35.1"
            "registry.k8s.io/kube-proxy:v1.35.1"
            "registry.k8s.io/coredns/coredns:v1.13.1"
            "registry.k8s.io/etcd:3.6.6-0"
            "registry.k8s.io/pause:3.10.1"
          )
          for img in "${IMAGES[@]}"; do sudo docker pull "$img" || true; done
          
          # 3. 彻底停止 Docker，准备打包整个物理数据目录
          sudo systemctl stop docker
          
          # 4. 把整个底层文件目录压缩成一个普通 tar 包
          cd /var/lib
          sudo tar -czf /tmp/docker_root_data.tar.gz docker/
          
      - name: Upload to Browser
        uses: actions/upload-artifact@v4
        with:
          name: docker-physical-data
          path: /tmp/docker_root_data.tar.gz
